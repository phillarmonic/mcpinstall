[project]
site_url = "https://phillarmonic.github.io/mcpinstall/"
site_name = "mcpinstall"
site_description = "Distribute an MCP server into the configuration files of Claude Code, Cursor, Copilot, Codex, and OpenCode, and write the matching agent guidance."
site_author = "Phillarmonic Software"

copyright = "Copyright &copy; 2026 Phillarmonic Software"

repo_url = "https://github.com/phillarmonic/mcpinstall"
repo_name = "phillarmonic/mcpinstall"
edit_uri = "edit/master/docs/docs/"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Hosts" = "hosts.md" },
  { "CLI reference" = "cli.md" },
  { "Guidance" = "guidance.md" },
  { "Embedding" = "embedding.md" },
  { "Architecture" = "architecture.md" },
  { "Development" = "development.md" },
  { "Glossary" = "glossary.md" },
]

extra_css = ["stylesheets/shiki.css"]
extra_javascript = ["javascripts/shiki.mjs"]

[project.theme]
name = "material"
variant = "modern"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/plug-zap"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/phillarmonic/mcpinstall"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
  { name = "bash", class = "language-bash", format = "pymdownx.superfences.fence_code_format" },
  { name = "sh", class = "language-sh", format = "pymdownx.superfences.fence_code_format" },
  { name = "shell", class = "language-shell", format = "pymdownx.superfences.fence_code_format" },
  { name = "go", class = "language-go", format = "pymdownx.superfences.fence_code_format" },
  { name = "yaml", class = "language-yaml", format = "pymdownx.superfences.fence_code_format" },
  { name = "yml", class = "language-yml", format = "pymdownx.superfences.fence_code_format" },
  { name = "json", class = "language-json", format = "pymdownx.superfences.fence_code_format" },
  { name = "toml", class = "language-toml", format = "pymdownx.superfences.fence_code_format" },
  { name = "markdown", class = "language-markdown", format = "pymdownx.superfences.fence_code_format" },
  { name = "text", class = "language-text", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

# Hover tooltips and cross-links from the curated glossary page. Every "## "
# heading in glossary.md is a term; the first prose mention on any other page
# gains a tooltip that links back to its definition.
[project.markdown_extensions.zensical_glossary]
glossary_file = "glossary.md"
heading_level = 2
first_only = true

[project.validation]
invalid_links = true
invalid_link_anchors = true
